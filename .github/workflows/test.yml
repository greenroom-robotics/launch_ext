name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        job:
          - runner: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
            arch: amd64
            ros_distro: kilted
          # - runner: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
          #   arch: amd64
          #   ros_distro: iron

    name: Test - ${{ matrix.job.ros_distro }} - ${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.runner }}

    steps:
      - uses: Greenroom-Robotics/ros_test_action@main
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}
          ros_distro: ${{ matrix.job.ros_distro }}
