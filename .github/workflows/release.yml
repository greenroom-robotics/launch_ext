name: Tag & Release
on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: 'If not specified, all packages will be released.'
        options:
          - launch_ext

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  deb:
    uses: greenroom-robotics/ros_semantic_release_action/.github/workflows/release.yml@main
    with:
      package: ${{ inputs.package }}
      package_dir: .
      build_iron: true
      changelog: false
      skip_tag: false
    secrets:
      token: ${{ secrets.API_TOKEN_GITHUB }}

  pixi:
    needs: deb
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: mise-token
        with:
          app-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: greenroom-robotics
          repositories: mise
      - uses: actions/checkout@v6
        with:
          repository: greenroom-robotics/mise
          ref: v5
          token: ${{ steps.mise-token.outputs.token }}
          path: .mise-action
      - uses: ./.mise-action/.github/actions/recipes-pr
        with:
          dispatch-sha: ${{ github.sha }}
          package: ${{ inputs.package }}
          ros-distro: kilted
          gh-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
