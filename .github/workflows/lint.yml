name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    steps:
    - uses: actions/checkout@v4
    - name: Setup Lint deps
      run: |
        sudo apt-get update
        sudo apt-get -y install clang-format cppcheck

    - uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - uses: pre-commit/action@v3.0.1
