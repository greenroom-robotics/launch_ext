[workspace]
name = "launch_ext"
channels = [
  "az://stgrcondachannel.blob.core.windows.net/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies.launch_ext]
path   = "."                          # self-as-workspace-member idiom
extras = ["test"]                     # folds the test extra into the default env

[package]
name        = "launch_ext"
version     = "2.0.1"
description = "Some extras for launch tooling."
license     = "MIT"
authors     = ["Russ Webber <russ.webber@greenroomrobotics.com>"]

[package.build.backend]
name    = "pixi-build-ros-gr"
version = ">=0.5,<0.6"

[package.build.config]
mode       = "pixi-native"
build-type = "ament_python"
distro     = "kilted"

[package.run-dependencies]
ros-kilted-launch             = "*"
ros-kilted-launch-ros         = "*"
ros-kilted-example-interfaces = "*"
ros-kilted-xacro              = "*"
psutil                        = ">=5,<8"
jinja2                        = ">=3.1,<4"
gitpython                     = ">=3.1,<4"
dbus-python                   = "*"

[package.extra-dependencies.test]
ros-dev-tools-meta         = "*"
pytest                     = "*"
ros-kilted-ament-lint-auto = "*"

[tasks]
build = "colcon build --packages-select launch_ext --symlink-install"

[tasks.colcon-test]
cmd        = "bash -c 'colcon test --packages-select launch_ext --retest-until-pass 3 --event-handlers console_direct+ || [ $? -eq 5 ]'"
depends-on = ["build"]

[tasks.test]
cmd        = "colcon test-result --all --verbose"
depends-on = ["colcon-test"]
